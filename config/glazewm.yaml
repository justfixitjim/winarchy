# winarchy: Omarchy-style keyboard-driven tiling for Windows 11 (GlazeWM config).
# https://github.com/justfixitjim/winarchy
#
# Super = the left Windows key (lwin). Windows keeps a few Win+key combos for
# itself (Win+L lock, Win+V clipboard, Win+Shift+S screenshot, Win+E, Win+R,
# Win+I ...) and those are deliberately left unbound here.
#
# The comment directly above each keybinding is what the Super+K cheat sheet
# shows, so keep it short when you add new ones. Reload with Super+Ctrl+R.
#
# Note: GlazeWM 3.10.1 cannot parse a quoted program path ("C:/...") in
# shell-exec, so paths are written unquoted; spaces in them are fine.
#
# GlazeWM docs: https://github.com/glzr-io/glazewm

general:
  startup_commands:
    - 'shell-exec %ProgramFiles%/glzr.io/Zebar/zebar.exe'
    - 'shell-exec %USERPROFILE%/.glzr/winarchy/winarchy-daemon.exe'
    - 'shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe --resident'
  shutdown_commands:
    - 'shell-exec %USERPROFILE%/.glzr/winarchy/winarchy-daemon.exe --stop'
    - 'shell-exec --hide-window taskkill /IM zebar.exe /F'
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '10px'
  outer_gap:
    top: '10px'
    right: '10px'
    bottom: '10px'
    left: '10px'

# Tokyo Night colours, square corners (Omarchy's default look).
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7aa2f7'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#3b4261'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Generated by install.ps1 from your monitor layout. Monitors are numbered left
# to right from 0. The primary monitor gets workspaces 1-5 and the others share
# 6-9. Remove the bind_to_monitor lines to let workspaces follow focus instead.
workspaces:
{{WORKSPACES}}

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_process: { equals: 'winarchy' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # Small utility windows float instead of tiling.
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'CalculatorApp' }
      - window_class: { equals: 'OperationStatusWindow' }
      - window_process: { equals: 'PowerToys.Settings' }

keybindings:
  # ── Apps ──────────────────────────────────────────────────────────────
  # Terminal
  - commands: ['shell-exec wt']
    bindings: ['lwin+enter']
  # Browser (your default browser)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch browser']
    bindings: ['lwin+shift+b']
  # Browser, private window
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch browser-private']
    bindings: ['lwin+shift+alt+b']
  # File manager (Explorer)
  - commands: ['shell-exec explorer']
    bindings: ['lwin+shift+f']
  # Editor (VS Code, else Notepad)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch editor']
    bindings: ['lwin+shift+n']
  # Obsidian
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch app Obsidian Obsidian.Obsidian']
    bindings: ['lwin+shift+o']
  # Music (Spotify)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch app Spotify Spotify.Spotify']
    bindings: ['lwin+shift+m']
  # Discord
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch app Discord Discord.Discord']
    bindings: ['lwin+shift+d']
  # Games (Steam)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launch app Steam Valve.Steam']
    bindings: ['lwin+shift+g']
  # Activity monitor (Task Manager)
  - commands: ['shell-exec taskmgr']
    bindings: ['lwin+shift+t']

  # ── Menus ─────────────────────────────────────────────────────────────
  # Menu: browse, or type to search everything
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe launcher']
    bindings: ['lwin+space']
  # Menu (same as Super+Space)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe']
    bindings: ['lwin+alt+space']
  # Keybinding cheat sheet
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe keys']
    bindings: ['lwin+k']
  # Theme picker (colours for borders, bar, menu, Windows, Terminal, VS Code)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe theme']
    bindings: ['lwin+ctrl+shift+space']
  # Screen recording: start / stop (this monitor)
  - commands: ['shell-exec --hide-window powershell -NoProfile -STA -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%/.glzr/winarchy/tools/record.ps1']
    bindings: ['lwin+shift+r']
  # Power menu (lock, sleep, restart, shut down)
  - commands: ['shell-exec %USERPROFILE%/.glzr/winarchy/winarchy.exe system']
    bindings: ['lwin+escape']

  # ── Windows ───────────────────────────────────────────────────────────
  # Close window
  - commands: ['close']
    bindings: ['lwin+w']
  # Toggle fullscreen
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f']
  # Toggle floating / tiling
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+t']
  # Toggle split direction
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']
  # Cycle focus: tiling / floating / fullscreen
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+ctrl+space']
  # Focus window left
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  # Focus window right
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  # Focus window up
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  # Focus window down
  - commands: ['focus --direction down']
    bindings: ['lwin+down']
  # Move window left
  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  # Move window right
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  # Move window up
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  # Move window down
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']
  # Shrink width
  - commands: ['resize --width -5%']
    bindings: ['lwin+oem_minus']
  # Grow width
  - commands: ['resize --width +5%']
    bindings: ['lwin+oem_plus']
  # Shrink height
  - commands: ['resize --height -5%']
    bindings: ['lwin+shift+oem_minus']
  # Grow height
  - commands: ['resize --height +5%']
    bindings: ['lwin+shift+oem_plus']

  # ── Workspaces ────────────────────────────────────────────────────────
  # Next workspace
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+tab']
  # Previous workspace
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+tab']
  # Last used workspace
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+ctrl+tab']
  # Move workspace to monitor left
  - commands: ['move-workspace --direction left']
    bindings: ['lwin+alt+left']
  # Move workspace to monitor right
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+alt+right']
  # Move workspace to monitor up
  - commands: ['move-workspace --direction up']
    bindings: ['lwin+alt+up']
  # Move workspace to monitor down
  - commands: ['move-workspace --direction down']
    bindings: ['lwin+alt+down']
  # Go to workspace 1
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  # Go to workspace 2
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  # Go to workspace 3
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  # Go to workspace 4
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  # Go to workspace 5
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  # Go to workspace 6
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  # Go to workspace 7
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  # Go to workspace 8
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  # Go to workspace 9
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']
  # Send window to workspace 1
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+shift+1']
  # Send window to workspace 2
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+shift+2']
  # Send window to workspace 3
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+shift+3']
  # Send window to workspace 4
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+shift+4']
  # Send window to workspace 5
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+shift+5']
  # Send window to workspace 6
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+shift+6']
  # Send window to workspace 7
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+shift+7']
  # Send window to workspace 8
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+shift+8']
  # Send window to workspace 9
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+shift+9']

  # ── Window manager ────────────────────────────────────────────────────
  # Pause / resume tiling and all keybindings
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p']
  # Reload this config
  - commands: ['wm-reload-config']
    bindings: ['lwin+ctrl+r']
