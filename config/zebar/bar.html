<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import * as zebar from 'https://esm.sh/zebar@3.3.1';

      // Temperature unit for the weather readout: 'F' (Fahrenheit) or 'C' (Celsius).
      // winarchy's install.ps1 sets this; pass -Celsius to it for Celsius.
      const TEMP_UNIT = 'F';

      // winarchy's menu app. install.ps1 fills in the path (it must match the
      // shellCommands privilege in zpack.json exactly).
      const WINARCHY = '{{WINARCHY_EXE}}';

      // Windows VPN connection to toggle from the bar (empty = no VPN button).
      // install.ps1 fills this in with the first VPN found in Settings > Network > VPN.
      const VPN_NAME = '{{VPN_NAME}}';
      // Phonebook that holds it (all-user or per-user), for Windows' sign-in dialog.
      const VPN_PBK = '{{VPN_PBK}}';

      // winarchy's AI usage script (Claude Code and Codex accounts). install.ps1 fills in the path.
      const AGENTS = '{{AGENTS_PS1}}';

      // winarchy's process helper (video memory for the bar, everything for the process panel).
      const TOP = '{{TOP_EXE}}';

      // Runs an allowed program without waiting for it to exit.
      function run(program, args) {
        zebar.shellSpawn(program, args).catch(err => console.error(err));
      }

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
        audio: { type: 'audio' },
        systray: { type: 'systray' },
      });

      // System tray: the taskbar is hidden, so tray-only apps show here instead.
      // Collapsed to a count by default; clicks go to each app as they would on the
      // taskbar, so right-click opens the app's own menu (with Quit) to close it.
      function Tray({ systray }) {
        const [open, setOpen] = useState(() => {
          try { return localStorage.getItem('winarchy.trayOpen') === '1'; } catch { return false; }
        });
        function toggle() {
          setOpen(o => {
            try { localStorage.setItem('winarchy.trayOpen', o ? '0' : '1'); } catch {}
            return !o;
          });
        }
        // Apps that crash or are killed never remove their icon, and Zebar keeps it. Every 30 s
        // (and when the tray opens) send each icon a no-op "pointer left" message: Zebar refuses
        // it when the app's window is gone, and those ghosts are hidden. A live app that reuses
        // the same icon shows up again on the next check.
        const [dead, setDead] = useState(() => new Set());
        const allIcons = systray.icons || [];
        const idsKey = allIcons.map(i => i.id).join('|');
        useEffect(() => {
          let stopped = false;
          async function prune() {
            const ids = (systray.icons || []).map(i => i.id);
            const results = await Promise.allSettled(ids.map(id => systray.onHoverLeave(id)));
            if (!stopped) setDead(new Set(ids.filter((id, n) => results[n].status === 'rejected')));
          }
          prune();
          const timer = setInterval(prune, 30000);
          return () => { stopped = true; clearInterval(timer); };
        }, [idsKey, open]);
        const live = allIcons.filter(i => !dead.has(i.id));
        const rec = live.find(isRecording);
        const icons = live.filter(i => !isRecording(i));
        if (!icons.length && !rec) return null;
        return (
          <div className={`tray ${open ? 'open' : ''}`}>
            {rec && <Recording key={rec.id} icon={rec} systray={systray} />}
            {open && icons.map(icon => (
              <img
                key={icon.id}
                className="tray-icon"
                src={icon.iconUrl}
                title={`${icon.tooltip || ''}\nRight-click for its menu (Quit, Exit)`}
                onClick={() => systray.onLeftClick(icon.id)}
                onDoubleClick={() => systray.onLeftDoubleClick(icon.id)}
                onContextMenu={e => { e.preventDefault(); systray.onRightClick(icon.id); }}
                onAuxClick={e => e.button === 1 && systray.onMiddleClick(icon.id)}
                onMouseEnter={() => systray.onHoverEnter(icon.id)}
                onMouseLeave={() => systray.onHoverLeave(icon.id)}
              />
            ))}
            {icons.length > 0 && (
              <button className="tray-toggle" title={open ? 'Hide tray icons' : 'Show tray icons'} onClick={toggle}>
                <i className={`nf ${open ? 'nf-md-chevron_right' : 'nf-md-chevron_left'}`}></i>
                {!open && <span> {icons.length}</span>}
              </button>
            )}
          </div>
        );
      }

      // Screen recording (tools/record.ps1) keeps a tray icon with this text while it runs.
      const isRecording = icon => (icon.tooltip || '').startsWith('winarchy recording');

      function Recording({ icon, systray }) {
        const [start] = useState(() => Date.now());
        const [, setTick] = useState(0);
        useEffect(() => {
          const timer = setInterval(() => setTick(n => n + 1), 1000);
          return () => clearInterval(timer);
        }, []);
        const s = Math.floor((Date.now() - start) / 1000);
        return (
          <button className="rec" title="Recording this screen. Click or press Super+Alt+R to stop." onClick={() => systray.onLeftClick(icon.id)}>
            <span className="rec-dot"></span>REC {Math.floor(s / 60)}:{String(s % 60).padStart(2, '0')}
          </button>
        );
      }

      // CPU, RAM and video memory together; click for the process panel (a slim task manager).
      // VRAM isn't a Zebar provider, so winarchy-top.exe streams it every 5 seconds.
      function Stats({ cpu, memory }) {
        const [vram, setVram] = useState(null);
        useEffect(() => {
          let proc = null, stopped = false, retry = null;
          async function start() {
            try {
              proc = await zebar.shellSpawn(TOP, ['summary', '5000']);
              proc.onStdout(line => { try { setVram(JSON.parse(line)); } catch {} });
              proc.onExit(() => { if (!stopped) retry = setTimeout(start, 15000); });
            } catch (err) { console.error(err); }
          }
          start();
          return () => { stopped = true; clearTimeout(retry); try { proc?.kill(); } catch {} };
        }, []);
        const level = p => (p >= 85 ? 'high' : p >= 60 ? 'mid' : '');
        const vp = vram && vram.vramTotal > 0 ? (vram.vramUsed / vram.vramTotal) * 100 : null;
        const gb = b => (b / 1073741824).toFixed(1);
        const tip = [
          cpu && `CPU ${Math.round(cpu.usage)}%`,
          memory && `RAM ${gb(memory.usedMemory)} / ${gb(memory.totalMemory)} GB`,
          vp != null && `VRAM ${gb(vram.vramUsed)} / ${gb(vram.vramTotal)} GB`,
          'Click for processes',
        ].filter(Boolean).join('\n');
        return (
          <button className="stats" title={tip} onClick={() => zebar.startWidgetPreset('processes', 'panel').catch(console.error)}>
            {cpu && <span className="stat"><i className="nf nf-oct-cpu"></i><span className={level(cpu.usage)}>{Math.round(cpu.usage)}%</span></span>}
            {memory && <span className="stat"><i className="nf nf-fae-chip"></i><span className={level(memory.usage)}>{Math.round(memory.usage)}%</span></span>}
            {vp != null && <span className="stat"><i className="nf nf-md-expansion_card vram-icon"></i><span className={level(vp)}>{Math.round(vp)}%</span></span>}
          </button>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);

      // Volume: scroll to change, click the icon to mute, drag the slider (shown on
      // hover), right-click for Windows sound settings.
      function Volume({ audio }) {
        const device = audio.defaultPlaybackDevice;
        const volume = device.volume;
        const set = v => audio.setVolume(Math.max(0, Math.min(100, Math.round(v))));
        const icon = device.isMuted || volume === 0
          ? 'nf-md-volume_off'
          : volume < 34 ? 'nf-md-volume_low'
          : volume < 67 ? 'nf-md-volume_medium'
          : 'nf-md-volume_high';
        return (
          <div
            className={`volume ${device.isMuted ? 'muted' : ''}`}
            title={device.name}
            onWheel={e => set(volume + (e.deltaY < 0 ? 2 : -2))}
            onContextMenu={e => { e.preventDefault(); run('explorer.exe', 'ms-settings:sound'); }}
          >
            {/* Slider first: the bar is right-aligned, so it grows leftward and the icon stays under the cursor. */}
            <input
              type="range" min="0" max="100" value={volume}
              onChange={e => set(Number(e.target.value))}
            />
            <button className={`nf ${icon}`} onClick={() => audio.setMute(!device.isMuted)}></button>
            <span>{volume}%</span>
          </div>
        );
      }

      // VPN: shows whether the Windows VPN connection is up; click to connect or disconnect
      // (uses the saved credentials, through Windows' own rasdial).
      function Vpn() {
        const [state, setState] = useState('unknown'); // connected | disconnected | busy | error
        const [detail, setDetail] = useState('');

        async function refresh() {
          try {
            const out = await zebar.shellExec('rasdial.exe');
            const up = out.stdout.split(/\r?\n/).some(l => l.trim().toLowerCase() === VPN_NAME.toLowerCase());
            setState(s => (s === 'busy' ? s : up ? 'connected' : 'disconnected'));
          } catch (err) {
            setState('error');
            setDetail(String(err));
          }
        }

        useEffect(() => {
          refresh();
          const timer = setInterval(refresh, 15000); // rasdial is quick, but no need to run it constantly
          return () => clearInterval(timer);
        }, []);

        async function toggle() {
          if (state === 'connected') {
            setState('busy');
            setDetail('Disconnecting...');
            try { await zebar.shellExec('rasdial.exe', [VPN_NAME, '/disconnect']); } catch (err) { setDetail(String(err)); }
            setState('disconnected');
            setTimeout(refresh, 1000);
            return;
          }
          // Connect through Windows' own dialer: it uses the sign-in details saved with the
          // connection (rasdial can't read those, and failed tries can lock work accounts).
          // It connects straight away if the connection doesn't prompt; otherwise its
          // sign-in window opens with your details filled in, and Enter connects.
          setState('busy');
          setDetail('Connecting...');
          zebar.shellSpawn('rasphone.exe', VPN_PBK ? ['-f', VPN_PBK, '-d', VPN_NAME] : ['-d', VPN_NAME]).catch(err => setDetail(String(err)));
          for (let i = 0; i < 60; i++) {
            await new Promise(r => setTimeout(r, 1000));
            const out = await zebar.shellExec('rasdial.exe').catch(() => null);
            if (out && out.stdout.split(/\r?\n/).some(l => l.trim().toLowerCase() === VPN_NAME.toLowerCase())) {
              setDetail('');
              setState('connected');
              return;
            }
          }
          setDetail('');
          setState('disconnected');
        }

        const icon = state === 'connected' ? 'nf-md-shield_lock'
          : state === 'busy' ? 'nf-md-shield_sync_outline'
          : state === 'error' ? 'nf-md-shield_alert_outline'
          : 'nf-md-shield_off_outline';
        const label = state === 'connected' ? 'VPN on' : state === 'busy' ? 'VPN...' : 'VPN off';
        return (
          <button
            className={`vpn ${state}`}
            title={`${VPN_NAME}: ${state}${detail ? ' - ' + detail : ''}\nClick to ${state === 'connected' ? 'disconnect' : 'connect'}`}
            onClick={() => state !== 'busy' && toggle()}
          >
            <i className={`nf ${icon}`}></i> {label}
          </button>
        );
      }

      // AI usage: the active account's share of its 5-hour / weekly limits per agent, coloured
      // by headroom. Hover for a summary; click for the AI panel (agents.html: usage bars, switching).
      function Agents() {
        const [data, setData] = useState(null);

        // Read the script's cache directly (cheap); start PowerShell only when it's a few minutes old.
        const cache = AGENTS.replace(/tools\\agents\.ps1$/i, 'agents\\usage.json');
        async function refresh() {
          try {
            let text = (await zebar.shellExec('cmd.exe', ['/c', 'type', cache]).catch(() => ({ stdout: '' }))).stdout.trim();
            const updated = text ? JSON.parse(text).updated : null;
            if (!updated || Date.now() - new Date(updated) > 4 * 60 * 1000) {
              text = (await zebar.shellExec('powershell.exe', ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-File', AGENTS, 'usage'])).stdout.trim();
            }
            if (text) setData(JSON.parse(text));
          } catch (err) {
            console.error(err);
          }
        }

        useEffect(() => {
          refresh();
          const timer = setInterval(refresh, 120000); // the script itself re-checks every few minutes
          return () => clearInterval(timer);
        }, []);

        const providers = (data?.providers || []).filter(p => p.accounts?.some(a => a.status === 'ok' || a.session || a.weekly));
        if (!providers.length) return null;

        const when = iso => {
          if (!iso) return '';
          const d = new Date(iso);
          const soon = d - Date.now() < 20 * 3600 * 1000;
          return soon ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : d.toLocaleDateString([], { weekday: 'short', hour: 'numeric' });
        };
        const win = (w, name) => w ? `${name} ${Math.round(w.pct)}%${w.resetsAt ? ` (resets ${when(w.resetsAt)})` : ''}` : '';
        const tip = providers.map(p =>
          `${p.name} - ${p.mode === 'auto' ? `auto-switch at ${p.threshold}%` : `alert at ${p.threshold}%`}\n` +
          p.accounts.map(a => `${a.active ? '> ' : '   '}${a.label}${a.plan ? ` (${a.plan})` : ''}: ` +
            ([win(a.session, '5h'), win(a.weekly, 'week')].filter(Boolean).join(', ') || a.status) +
            (a.stale ? ' [old]' : '') + (a.status !== 'ok' && (a.session || a.weekly) ? ` - ${a.status}` : '')).join('\n')
        ).join('\n\n') + '\n\nClick for details and switching';

        return (
          <button className="agents" title={tip} onClick={() => zebar.startWidgetPreset('agents', 'panel').catch(console.error)}>
            <i className="nf nf-md-robot_outline"></i>
            {providers.map(p => {
              const a = p.accounts.find(x => x.active) || p.accounts[0];
              const peak = a.peak;
              const level = peak == null ? 'unknown' : peak >= p.threshold ? 'high' : peak >= p.threshold - 20 ? 'mid' : 'low';
              return (
                <span key={p.id} className={`agent ${level}`}>
                  {p.name} {peak == null ? '-' : `${Math.round(peak)}%`}
                  {p.accounts.length > 1 ? <sup>{p.accounts.indexOf(a) + 1}</sup> : null}
                </span>
              );
            })}
          </button>
        );
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              {/* Like Omarchy's logo: opens the winarchy menu (same as Super+Alt+Space). */}
              <button
                className="logo nf nf-fa-windows"
                title="winarchy menu (Super+Alt+Space)"
                onClick={() => run(WINARCHY)}
              ></button>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              <Agents />

              {output.systray && <Tray systray={output.systray} />}

              {VPN_NAME && <Vpn />}

              {output.audio?.defaultPlaybackDevice && (
                <Volume audio={output.audio} />
              )}

              {output.network && (
                <button
                  className="network"
                  title={`${output.network.defaultInterface?.ipv4Addresses?.[0] || 'Not connected'}\nClick for network details and Wi-Fi / wired switches`}
                  onClick={() => zebar.startWidgetPreset('network', 'panel').catch(console.error)}
                >
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </button>
              )}

              {(output.cpu || output.memory) && <Stats cpu={output.cpu} memory={output.memory} />}

              {output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}

              {output.weather && (
                <button
                  className="weather"
                  title="Click for the forecast"
                  onClick={() => zebar.startWidgetPreset('weather', 'panel').catch(console.error)}
                >
                  {getWeatherIcon(output.weather)}
                  {Math.round(TEMP_UNIT === 'C' ? output.weather.celsiusTemp : output.weather.fahrenheitTemp)}°{TEMP_UNIT}
                </button>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
