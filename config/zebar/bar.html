<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Plain JavaScript with htm templates (no in-browser compiling), and every library from the
         local vendor folder, so the bar starts fast and works without internet. -->
    <script type="module">
      import { React, createRoot, htm, zebar } from './vendor/ui.mjs';
      const { useState, useEffect } = React;
      const html = htm.bind(React.createElement);
      const Fragment = React.Fragment;

      // Temperature unit for the weather readout: 'F' (Fahrenheit) or 'C' (Celsius).
      // winarchy's install.ps1 sets this; pass -Celsius to it for Celsius.
      const TEMP_UNIT = 'F';

      // winarchy's menu app. install.ps1 fills in the path (it must match the
      // shellCommands privilege in zpack.json exactly).
      const WINARCHY = '{{WINARCHY_EXE}}';

      // Windows VPN connection to toggle from the bar (empty = no VPN button).
      // install.ps1 fills this in with the first VPN found in Settings > Network > VPN.
      const VPN_NAME = '{{VPN_NAME}}';
      // Phonebook that holds it (all-user or per-user), for Windows' sign-in dialog.
      const VPN_PBK = '{{VPN_PBK}}';

      // winarchy's AI usage script (Claude Code and Codex accounts). install.ps1 fills in the path.
      const AGENTS = '{{AGENTS_PS1}}';

      // winarchy's process helper (video memory for the bar, everything for the process panel).
      const TOP = '{{TOP_EXE}}';

      // winarchy's Bluetooth script (radio and paired devices). install.ps1 fills in the path.
      const BLUETOOTH = '{{BLUETOOTH_PS1}}';

      // Runs an allowed program without waiting for it to exit.
      function run(program, args) {
        zebar.shellSpawn(program, args).catch(err => console.error(err));
      }

      const panel = name => zebar.startWidgetPreset(name, 'panel').catch(console.error);

      // One stream from winarchy-top.exe every 5 seconds: video memory for Stats, and the toggles
      // (stay awake, night light, do not disturb, reminders) for Indicators.
      function useSummary() {
        const [summary, setSummary] = useState(null);
        useEffect(() => {
          let proc = null, stopped = false, retry = null;
          // Started again if it exits or can't start (the installer replaces it while the bar runs).
          async function start() {
            if (stopped) return;
            try {
              proc = await zebar.shellSpawn(TOP, ['summary', '5000']);
              if (stopped) { proc.kill(); return; }
              proc.onStdout(line => { try { setSummary(JSON.parse(line)); } catch {} });
              proc.onExit(() => { if (!stopped) retry = setTimeout(start, 15000); });
            } catch (err) {
              console.error(err);
              retry = setTimeout(start, 15000);
            }
          }
          start();
          return () => { stopped = true; clearTimeout(retry); try { proc?.kill(); } catch {} };
        }, []);
        return [summary, setSummary];
      }

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
        audio: { type: 'audio' },
        systray: { type: 'systray' },
        media: { type: 'media' },
      });

      // System tray: the taskbar is hidden, so tray-only apps show here instead.
      // Collapsed to a count by default; clicks go to each app as they would on the
      // taskbar, so right-click opens the app's own menu (with Quit) to close it.
      function Tray({ systray }) {
        const [open, setOpen] = useState(() => {
          try { return localStorage.getItem('winarchy.trayOpen') === '1'; } catch { return false; }
        });
        function toggle() {
          setOpen(o => {
            try { localStorage.setItem('winarchy.trayOpen', o ? '0' : '1'); } catch {}
            return !o;
          });
        }
        // Apps that crash or are killed never remove their icon, and Zebar keeps it. Every 30 s
        // (and when the tray opens) send each icon a no-op "pointer left" message: Zebar refuses
        // it when the app's window is gone, and those ghosts are hidden. A live app that reuses
        // the same icon shows up again on the next check.
        const [dead, setDead] = useState(() => new Set());
        const allIcons = systray.icons || [];
        const idsKey = allIcons.map(i => i.id).join('|');
        useEffect(() => {
          let stopped = false;
          async function prune() {
            const ids = (systray.icons || []).map(i => i.id);
            const results = await Promise.allSettled(ids.map(id => systray.onHoverLeave(id)));
            if (!stopped) setDead(new Set(ids.filter((id, n) => results[n].status === 'rejected')));
          }
          prune();
          const timer = setInterval(prune, 30000);
          return () => { stopped = true; clearInterval(timer); };
        }, [idsKey, open]);
        const live = allIcons.filter(i => !dead.has(i.id));
        const rec = live.find(isRecording);
        const icons = live.filter(i => !isRecording(i));
        if (!icons.length && !rec) return null;
        return html`
          <div className=${`tray ${open ? 'open' : ''}`}>
            ${rec && html`<${Recording} key=${rec.id} icon=${rec} systray=${systray} />`}
            ${open && icons.map(icon => html`
              <img
                key=${icon.id}
                className="tray-icon"
                src=${icon.iconUrl}
                title=${`${icon.tooltip || ''}\nRight-click for its menu (Quit, Exit)`}
                onClick=${() => systray.onLeftClick(icon.id)}
                onDoubleClick=${() => systray.onLeftDoubleClick(icon.id)}
                onContextMenu=${e => { e.preventDefault(); systray.onRightClick(icon.id); }}
                onAuxClick=${e => e.button === 1 && systray.onMiddleClick(icon.id)}
                onMouseEnter=${() => systray.onHoverEnter(icon.id)}
                onMouseLeave=${() => systray.onHoverLeave(icon.id)}
              />`)}
            ${icons.length > 0 && html`
              <button className="tray-toggle" title=${open ? 'Hide tray icons' : 'Show tray icons'} onClick=${toggle}>
                <i className=${`nf ${open ? 'nf-md-chevron_right' : 'nf-md-chevron_left'}`}></i>
                ${!open && html`<span> ${icons.length}</span>`}
              </button>`}
          </div>`;
      }

      // Screen recording (tools/record.ps1) keeps a tray icon with this text while it runs.
      const isRecording = icon => (icon.tooltip || '').startsWith('winarchy recording');

      function Recording({ icon, systray }) {
        const [start] = useState(() => Date.now());
        const [, setTick] = useState(0);
        useEffect(() => {
          const timer = setInterval(() => setTick(n => n + 1), 1000);
          return () => clearInterval(timer);
        }, []);
        const s = Math.floor((Date.now() - start) / 1000);
        return html`
          <button className="rec" title="Recording this screen. Click or press Super+Alt+R to stop." onClick=${() => systray.onLeftClick(icon.id)}>
            <span className="rec-dot"></span>REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}
          </button>`;
      }

      // CPU, RAM and video memory together; click for the process panel (a slim task manager).
      // VRAM isn't a Zebar provider, so it comes from winarchy-top.exe (useSummary).
      function Stats({ cpu, memory, vram }) {
        const level = p => (p >= 85 ? 'high' : p >= 60 ? 'mid' : '');
        const vp = vram && vram.vramTotal > 0 ? (vram.vramUsed / vram.vramTotal) * 100 : null;
        const gb = b => (b / 1073741824).toFixed(1);
        const tip = [
          cpu && `CPU ${Math.round(cpu.usage)}%`,
          memory && `RAM ${gb(memory.usedMemory)} / ${gb(memory.totalMemory)} GB`,
          vp != null && `VRAM ${gb(vram.vramUsed)} / ${gb(vram.vramTotal)} GB`,
          'Click for processes',
        ].filter(Boolean).join('\n');
        return html`
          <button className="stats" title=${tip} onClick=${() => panel('processes')}>
            ${cpu && html`<span className="stat"><i className="nf nf-oct-cpu"></i><span className=${level(cpu.usage)}>${Math.round(cpu.usage)}%</span></span>`}
            ${memory && html`<span className="stat"><i className="nf nf-fae-chip"></i><span className=${level(memory.usage)}>${Math.round(memory.usage)}%</span></span>`}
            ${vp != null && html`<span className="stat"><i className="nf nf-md-expansion_card vram-icon"></i><span className=${level(vp)}>${Math.round(vp)}%</span></span>`}
          </button>`;
      }

      // Toggles that are on (stay awake, do not disturb, night light, reminders), like Omarchy's
      // indicators. Hover to see the ones that are off too; click one to switch it.
      function Indicators({ summary, setSummary }) {
        const [, setTick] = useState(0);
        useEffect(() => { const t = setInterval(() => setTick(n => n + 1), 30000); return () => clearInterval(t); }, []);
        if (!summary) return null;
        const flip = (key, toggle) => {
          setSummary(s => ({ ...s, [key]: !s[key] }));   // at once; the next update confirms it
          run(WINARCHY, ['toggle', toggle]);
        };
        const reminders = summary.reminders || [];
        const left = due => {
          const m = Math.max(0, Math.round((due - Date.now()) / 60000));
          return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
        };
        const items = [
          { key: 'awake', toggle: 'awake', icon: 'nf-md-coffee', on: summary.awake, tip: 'Stay awake (Super+Ctrl+I): no sleep or screen-off' },
          { key: 'dnd', toggle: 'dnd', icon: 'nf-md-bell_off', on: summary.dnd, tip: 'Do not disturb (Super+Ctrl+Alt+,)', hide: summary.dnd == null },
          { key: 'nightLight', toggle: 'nightlight', icon: 'nf-md-weather_night', on: summary.nightLight, tip: 'Night light: warm colours' },
        ].filter(i => !i.hide);
        const any = items.some(i => i.on) || reminders.length > 0;
        return html`
          <div className=${`indicators ${any ? '' : 'idle'}`}>
            ${reminders.length > 0 && html`
              <button className="indicator on" title=${reminders.map(r => `${left(r.due)}  ${r.text}`).join('\n') + '\nClick for reminders (Super+Ctrl+Alt+R)'} onClick=${() => panel('clock')}>
                <i className="nf nf-md-alarm"></i>${left(reminders[0].due)}
              </button>`}
            ${items.map(i => html`
              <button key=${i.key} className=${`indicator ${i.on ? 'on' : 'off'}`} title=${`${i.tip}\nClick to turn ${i.on ? 'off' : 'on'}`} onClick=${() => flip(i.key, i.toggle)}>
                <i className=${`nf ${i.icon}`}></i>
              </button>`)}
            ${!any && html`<span className="indicator peek nf nf-md-circle_small"></span>`}
          </div>`;
      }

      // Now playing (any app that shows in Windows' media controls): click to play / pause,
      // middle-click for the next track, scroll for next / previous.
      function Media({ media }) {
        const s = media.currentSession;
        if (!s || !(s.title || s.artist)) return null;
        const label = [s.title, s.artist].filter(Boolean).join(' - ');
        return html`
          <button
            className=${`media ${s.isPlaying ? 'playing' : ''}`}
            title=${`${label}${s.albumTitle ? `\n${s.albumTitle}` : ''}\nClick: play / pause   Middle-click: next   Scroll: next / previous`}
            onClick=${() => media.togglePlayPause()}
            onAuxClick=${e => e.button === 1 && media.next()}
            onWheel=${e => (e.deltaY > 0 ? media.next() : media.previous())}
          >
            <i className=${`nf ${s.isPlaying ? 'nf-md-pause' : 'nf-md-play'}`}></i>
            <span className="media-text">${label}</span>
          </button>`;
      }

      // Bluetooth: hidden when the PC has no Bluetooth; click for the Bluetooth panel.
      function Bluetooth() {
        const [info, setInfo] = useState(null);
        const cache = BLUETOOTH.replace(/tools\\bluetooth\.ps1$/i, 'bluetooth.json');
        const busy = React.useRef(false);
        async function refresh(run) {
          if (run && busy.current) return;   // never two PowerShells at once if one is slow
          if (run) busy.current = true;
          try {
            const text = run
              ? (await zebar.shellExec('powershell.exe', ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-File', BLUETOOTH, 'info'])).stdout.trim()
              : (await zebar.shellExec('cmd.exe', ['/c', 'type', cache]).catch(() => ({ stdout: '' }))).stdout.trim();
            if (text) setInfo(JSON.parse(text));
          } catch (err) { console.error(err); }
          finally { if (run) busy.current = false; }
        }
        useEffect(() => {
          refresh(false).then(() => refresh(true));
          const quick = setInterval(() => refresh(false), 20000);  // the panel keeps the file fresh while used
          const full = setInterval(() => refresh(true), 180000);
          return () => { clearInterval(quick); clearInterval(full); };
        }, []);
        if (!info || info.radio === 'none') return null;
        const connected = (info.devices || []).filter(d => d.connected);
        const on = info.radio === 'on';
        const icon = !on ? 'nf-md-bluetooth_off' : connected.length ? 'nf-md-bluetooth_connect' : 'nf-md-bluetooth';
        const tip = !on ? 'Bluetooth off' : connected.length
          ? connected.map(d => `${d.name}${d.battery != null ? `  ${d.battery}%` : ''}`).join('\n')
          : 'Bluetooth on, nothing connected';
        return html`
          <button className=${`bluetooth ${on ? '' : 'off'}`} title=${`${tip}\nClick for Bluetooth (Super+Ctrl+B)`} onClick=${() => panel('bluetooth')}>
            <i className=${`nf ${icon}`}></i>${connected.length > 1 ? html`<span> ${connected.length}</span>` : null}
          </button>`;
      }

      // Volume: click for the audio panel (outputs, inputs, per-app volume), right-click to mute,
      // scroll to change, or drag the slider shown on hover.
      function Volume({ audio }) {
        const device = audio.defaultPlaybackDevice;
        const volume = device.volume;
        const set = v => audio.setVolume(Math.max(0, Math.min(100, Math.round(v))));
        const icon = device.isMuted || volume === 0
          ? 'nf-md-volume_off'
          : volume < 34 ? 'nf-md-volume_low'
          : volume < 67 ? 'nf-md-volume_medium'
          : 'nf-md-volume_high';
        // Slider first: the bar is right-aligned, so it grows leftward and the icon stays under the cursor.
        return html`
          <div
            className=${`volume ${device.isMuted ? 'muted' : ''}`}
            title=${`${device.name}\nClick: audio panel (Super+Ctrl+A)   Right-click: mute   Scroll: volume`}
            onWheel=${e => set(volume + (e.deltaY < 0 ? 2 : -2))}
            onContextMenu=${e => { e.preventDefault(); audio.setMute(!device.isMuted); }}
          >
            <input
              type="range" min="0" max="100" value=${volume}
              onChange=${e => set(Number(e.target.value))}
            />
            <button className=${`nf ${icon}`} onClick=${() => panel('audio')}></button>
            <span>${volume}%</span>
          </div>`;
      }

      // VPN: shows whether the Windows VPN connection is up; click to connect or disconnect
      // (uses the saved credentials, through Windows' own rasdial).
      function Vpn() {
        const [state, setState] = useState('unknown'); // connected | disconnected | busy | error
        const [detail, setDetail] = useState('');

        async function refresh() {
          try {
            const out = await zebar.shellExec('rasdial.exe');
            const up = out.stdout.split(/\r?\n/).some(l => l.trim().toLowerCase() === VPN_NAME.toLowerCase());
            setState(s => (s === 'busy' ? s : up ? 'connected' : 'disconnected'));
          } catch (err) {
            setState('error');
            setDetail(String(err));
          }
        }

        useEffect(() => {
          refresh();
          const timer = setInterval(refresh, 15000); // rasdial is quick, but no need to run it constantly
          return () => clearInterval(timer);
        }, []);

        async function toggle() {
          if (state === 'connected') {
            setState('busy');
            setDetail('Disconnecting...');
            try { await zebar.shellExec('rasdial.exe', [VPN_NAME, '/disconnect']); } catch (err) { setDetail(String(err)); }
            setState('disconnected');
            setTimeout(refresh, 1000);
            return;
          }
          // Connect through Windows' own dialer: it uses the sign-in details saved with the
          // connection (rasdial can't read those, and failed tries can lock work accounts).
          // It connects straight away if the connection doesn't prompt; otherwise its
          // sign-in window opens with your details filled in, and Enter connects.
          setState('busy');
          setDetail('Connecting...');
          zebar.shellSpawn('rasphone.exe', VPN_PBK ? ['-f', VPN_PBK, '-d', VPN_NAME] : ['-d', VPN_NAME]).catch(err => setDetail(String(err)));
          for (let i = 0; i < 60; i++) {
            await new Promise(r => setTimeout(r, 1000));
            const out = await zebar.shellExec('rasdial.exe').catch(() => null);
            if (out && out.stdout.split(/\r?\n/).some(l => l.trim().toLowerCase() === VPN_NAME.toLowerCase())) {
              setDetail('');
              setState('connected');
              return;
            }
          }
          setDetail('');
          setState('disconnected');
        }

        const icon = state === 'connected' ? 'nf-md-shield_lock'
          : state === 'busy' ? 'nf-md-shield_sync_outline'
          : state === 'error' ? 'nf-md-shield_alert_outline'
          : 'nf-md-shield_off_outline';
        const label = state === 'connected' ? 'VPN on' : state === 'busy' ? 'VPN...' : 'VPN off';
        return html`
          <button
            className=${`vpn ${state}`}
            title=${`${VPN_NAME}: ${state}${detail ? ' - ' + detail : ''}\nClick to ${state === 'connected' ? 'disconnect' : 'connect'}`}
            onClick=${() => state !== 'busy' && toggle()}
          >
            <i className=${`nf ${icon}`}></i> ${label}
          </button>`;
      }

      // AI usage: the active account's share of its 5-hour / weekly limits per agent, coloured
      // by headroom. Hover for a summary; click for the AI panel (agents.html: usage bars, switching).
      function Agents() {
        const [data, setData] = useState(null);

        // Read the script's cache directly (cheap); start PowerShell only when it's a few minutes old.
        const cache = AGENTS.replace(/tools\\agents\.ps1$/i, 'agents\\usage.json');
        const busy = React.useRef(false);
        async function refresh() {
          if (busy.current) return;   // the last check (it can take a while) is still running
          busy.current = true;
          try {
            let text = (await zebar.shellExec('cmd.exe', ['/c', 'type', cache]).catch(() => ({ stdout: '' }))).stdout.trim();
            const updated = text ? JSON.parse(text).updated : null;
            if (!updated || Date.now() - new Date(updated) > 4 * 60 * 1000) {
              text = (await zebar.shellExec('powershell.exe', ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', '-File', AGENTS, 'usage'])).stdout.trim();
            }
            if (text) setData(JSON.parse(text));
          } catch (err) {
            console.error(err);
          } finally {
            busy.current = false;
          }
        }

        useEffect(() => {
          refresh();
          const timer = setInterval(refresh, 120000); // the script itself re-checks every few minutes
          return () => clearInterval(timer);
        }, []);

        const providers = (data?.providers || []).filter(p => p.accounts?.some(a => a.status === 'ok' || a.session || a.weekly));
        if (!providers.length) return null;

        const when = iso => {
          if (!iso) return '';
          const d = new Date(iso);
          const soon = d - Date.now() < 20 * 3600 * 1000;
          return soon ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : d.toLocaleDateString([], { weekday: 'short', hour: 'numeric' });
        };
        const win = (w, name) => w ? `${name} ${Math.round(w.pct)}%${w.resetsAt ? ` (resets ${when(w.resetsAt)})` : ''}` : '';
        const tip = providers.map(p =>
          `${p.name} - ${p.mode === 'auto' ? `auto-switch at ${p.threshold}%` : `alert at ${p.threshold}%`}\n` +
          p.accounts.map(a => `${a.active ? '> ' : '   '}${a.label}${a.plan ? ` (${a.plan})` : ''}: ` +
            ([win(a.session, '5h'), win(a.weekly, 'week')].filter(Boolean).join(', ') || a.status) +
            (a.stale ? ' [old]' : '') + (a.status !== 'ok' && (a.session || a.weekly) ? ` - ${a.status}` : '')).join('\n')
        ).join('\n\n') + '\n\nClick for details and switching\nRight-click to start your default agent (Super+Shift+Ctrl+A)';

        return html`
          <button className="agents" title=${tip} onClick=${() => panel('agents')}
            onContextMenu=${e => { e.preventDefault(); run(WINARCHY, ['agent']); }}>
            <i className="nf nf-md-robot_outline"></i>
            ${providers.map(p => {
              const a = p.accounts.find(x => x.active) || p.accounts[0];
              const peak = a.peak;
              const level = peak == null ? 'unknown' : peak >= p.threshold ? 'high' : peak >= p.threshold - 20 ? 'mid' : 'low';
              return html`
                <span key=${p.id} className=${`agent ${level}`}>
                  ${p.name} ${peak == null ? '-' : `${Math.round(peak)}%`}
                  ${p.accounts.length > 1 ? html`<sup>${p.accounts.indexOf(a) + 1}</sup>` : null}
                </span>`;
            })}
          </button>`;
      }

      // Workspaces, like Omarchy's: 1-5 always in place (GlazeWM only keeps workspaces that are in
      // use, so on their own the numbers came and went), plus any other workspace in use on any
      // monitor. Empty ones are dim; click one to go to it, wherever it is.
      function Workspaces({ wm }) {
        const all = wm.allWorkspaces || wm.currentWorkspaces || [];
        const byName = new Map(all.map(w => [w.name, w]));
        const here = wm.currentMonitor?.id;
        // Another monitor's workspace shows only if it has windows (or focus): each monitor always
        // keeps one on screen, even an empty one, and that's just noise here.
        const shown = all.filter(w => w.parentId === here || (w.children || []).length > 0 || w.hasFocus);
        const names = [...new Set(['1', '2', '3', '4', '5', ...shown.map(w => w.name)])]
          .sort((a, b) => (parseFloat(a) - parseFloat(b)) || a.localeCompare(b));
        return html`
          <div className="workspaces">
            ${names.map(name => {
              const w = byName.get(name);
              const used = w && (w.children || []).length > 0;
              const elsewhere = w && here && w.parentId !== here;
              const cls = ['workspace', w?.hasFocus && 'focused', w?.isDisplayed && 'displayed', !used && 'empty', elsewhere && 'elsewhere'];
              const tip = `Workspace ${name}${!w ? '' : !used ? ' (empty)' : ''}${elsewhere ? ', on another monitor' : ''}`;
              return html`
                <button key=${name} className=${cls.filter(Boolean).join(' ')} title=${tip}
                  onClick=${() => wm.runCommand(`focus --workspace ${name}`)}>
                  ${w?.displayName ?? name}
                </button>`;
            })}
          </div>`;
      }

      // Icon for the current network status.
      function networkIcon(net) {
        switch (net.defaultInterface?.type) {
          case 'ethernet': return 'nf-md-ethernet_cable';
          case 'proprietary_virtual': return 'nf-md-shield_lock_outline';
          case 'wifi': {
            const s = net.defaultGateway?.signalStrength;
            return s >= 80 ? 'nf-md-wifi_strength_4' : s >= 65 ? 'nf-md-wifi_strength_3'
              : s >= 40 ? 'nf-md-wifi_strength_2' : s >= 25 ? 'nf-md-wifi_strength_1' : 'nf-md-wifi_strength_outline';
          }
          default: return 'nf-md-wifi_strength_off_outline';
        }
      }

      // Icon for how much of the battery is charged.
      function batteryIcon(b) {
        const p = b.chargePercent;
        return p > 90 ? 'nf-fa-battery_4' : p > 70 ? 'nf-fa-battery_3' : p > 40 ? 'nf-fa-battery_2' : p > 20 ? 'nf-fa-battery_1' : 'nf-fa-battery_0';
      }

      // Icon for the current weather.
      const WEATHER_ICONS = {
        clear_day: 'nf-weather-day_sunny', clear_night: 'nf-weather-night_clear',
        cloudy_day: 'nf-weather-day_cloudy', cloudy_night: 'nf-weather-night_alt_cloudy',
        light_rain_day: 'nf-weather-day_sprinkle', light_rain_night: 'nf-weather-night_alt_sprinkle',
        heavy_rain_day: 'nf-weather-day_rain', heavy_rain_night: 'nf-weather-night_alt_rain',
        snow_day: 'nf-weather-day_snow', snow_night: 'nf-weather-night_alt_snow',
        thunder_day: 'nf-weather-day_lightning', thunder_night: 'nf-weather-night_alt_lightning',
      };

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [summary, setSummary] = useSummary();

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        const wm = output.glazewm;
        return html`
          <div className="app">
            <div className="left">
              <!-- Like Omarchy's logo: opens the winarchy menu (same as Super+Alt+Space). -->
              <button
                className="logo nf nf-fa-windows"
                title="winarchy menu (Super+Alt+Space)"
                onClick=${() => run(WINARCHY)}
              ></button>
              ${wm && html`<${Workspaces} wm=${wm} />`}
            </div>

            <div className="center">
              <button className="clock" title="Click for the calendar and reminders (Super+Ctrl+Alt+R)" onClick=${() => panel('clock')}>
                ${output.date?.formatted}
              </button>
              <${Indicators} summary=${summary} setSummary=${setSummary} />
              ${output.media && html`<${Media} media=${output.media} />`}
            </div>

            <div className="right">
              ${wm && html`
                <${Fragment}>
                  ${wm.isPaused && html`
                    <button className="paused-button" onClick=${() => wm.runCommand('wm-toggle-pause')}>PAUSED</button>`}
                  ${wm.bindingModes.map(bindingMode => html`
                    <button
                      className="binding-mode"
                      key=${bindingMode.name}
                      onClick=${() => wm.runCommand(`wm-disable-binding-mode --name ${bindingMode.name}`)}
                    >
                      ${bindingMode.displayName ?? bindingMode.name}
                    </button>`)}
                  <button
                    className=${`tiling-direction nf ${wm.tilingDirection === 'horizontal' ? 'nf-md-swap_horizontal' : 'nf-md-swap_vertical'}`}
                    onClick=${() => wm.runCommand('toggle-tiling-direction')}
                  ></button>
                <//>`}

              <${Agents} />

              ${output.systray && html`<${Tray} systray=${output.systray} />`}

              ${VPN_NAME && html`<${Vpn} />`}

              ${output.audio?.defaultPlaybackDevice && html`<${Volume} audio=${output.audio} />`}

              <${Bluetooth} />

              ${output.network && html`
                <button
                  className="network"
                  title=${`${output.network.defaultInterface?.ipv4Addresses?.[0] || 'Not connected'}\nClick for network details and Wi-Fi / wired switches`}
                  onClick=${() => zebar.startWidgetPreset('network', 'panel').catch(console.error)}
                >
                  <i className=${`nf ${networkIcon(output.network)}`}></i>
                  ${output.network.defaultGateway?.ssid}
                </button>`}

              ${(output.cpu || output.memory) && html`<${Stats} cpu=${output.cpu} memory=${output.memory} vram=${summary} />`}

              ${output.battery && html`
                <div className="battery">
                  ${output.battery.isCharging && html`<i className="nf nf-md-power_plug charging-icon"></i>`}
                  <i className=${`nf ${batteryIcon(output.battery)}`}></i>
                  ${Math.round(output.battery.chargePercent)}%
                </div>`}

              ${output.weather && html`
                <button
                  className="weather"
                  title="Click for the forecast"
                  onClick=${() => zebar.startWidgetPreset('weather', 'panel').catch(console.error)}
                >
                  <i className=${`nf ${WEATHER_ICONS[output.weather.status] || 'nf-weather-cloudy'}`}></i>
                  ${Math.round(TEMP_UNIT === 'C' ? output.weather.celsiusTemp : output.weather.fahrenheitTemp)}°${TEMP_UNIT}
                </button>`}
            </div>
          </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
